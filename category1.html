<!doctype html>
<html lang="ar" dir="rtl" data-theme="beige">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#E7D9C4"/>
  <meta name="description" content="SOS STORE - Category"/>
  <title>SOS STORE | Category</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body data-page="category">
  <a class="skip" href="#main">تخطي للمحتوى</a>

  <header class="header" id="top">
    <div class="container header__inner">
      <a class="brand" href="index.html" aria-label="SOS STORE">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">
          <span class="brand__title">SOS STORE</span>
          <span class="brand__sub">Category</span>
        </span>
      </a>

      <div class="header__actions">
        <button class="iconBtn" id="themeBtn" type="button" aria-label="Theme" aria-pressed="false">◐</button>
        <button class="iconBtn" id="wishBtn" type="button" aria-label="Wishlist" aria-haspopup="dialog" aria-controls="wishDrawer">♥ <span class="badge" id="wishCount">0</span></button>
        <button class="iconBtn" id="cartBtn" type="button" aria-label="Cart" aria-haspopup="dialog" aria-controls="cartDrawer">🛒 <span class="badge" id="cartCount">0</span></button>
      </div>
    </div>

    <div class="container controlbar">
      <div class="controlbar__left">
        <div class="search">
          <input id="categorySearch" class="input input--search" type="search" placeholder="ابحث داخل القسم..." autocomplete="off"/>
          <button class="iconBtn iconBtn--mini" id="categoryClear" type="button" aria-label="Clear">✕</button>
        </div>

        <select class="select" id="categoryFilter" aria-label="Filter">
          <option value="all">ALL</option>
        </select>
      </div>

      <div class="controlbar__right">
        <a class="btn btn--ghost btn--sm" href="index.html">⬅ رجوع</a>
        <span class="hint" id="categoryCount" aria-live="polite"></span>
      </div>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container">
      <div class="pageHead">
        <div class="pageHead__row">
          <h1 class="pageHead__title" id="categoryTitle">قسم</h1>
        </div>
        <p class="pageHead__sub" id="categorySub"></p>
      </div>

      <div class="grid reveal" id="categoryGrid" aria-live="polite"></div>
    </div>

    <footer class="footer" style="margin-top:18px">
      <div class="container footer__inner">
        <div>© <span id="year"></span> SOS STORE</div>
        <a class="navLink" href="#top">أعلى</a>
      </div>
    </footer>

    <button class="toTop" id="toTop" type="button" aria-label="Top">↑</button>

    <aside class="drawer" id="cartDrawer" aria-hidden="true">
      <div class="drawer__overlay" data-close="cart"></div>
      <div class="drawer__panel" role="dialog" aria-label="Cart">
        <div class="drawer__head">
          <div class="drawer__title">سلة المشتريات</div>
          <button class="iconBtn" type="button" data-close="cart" aria-label="Close">✕</button>
        </div>
        <div class="drawer__body" id="cartItems"></div>
        <div class="drawer__foot">
          <div class="drawer__row">
            <span>الإجمالي</span>
            <strong id="cartTotal">0</strong>
          </div>
          <button class="btn btn--primary" id="checkoutBtn" type="button">إتمام الطلب</button>
          <button class="btn btn--ghost" id="clearCart" type="button">تفريغ السلة</button>
        </div>
      </div>
    </aside>

    <aside class="drawer" id="wishDrawer" aria-hidden="true">
      <div class="drawer__overlay" data-close="wish"></div>
      <div class="drawer__panel" role="dialog" aria-label="Wishlist">
        <div class="drawer__head">
          <div class="drawer__title">المفضلة</div>
          <button class="iconBtn" type="button" data-close="wish" aria-label="Close">✕</button>
        </div>
        <div class="drawer__body" id="wishItems"></div>
        <div class="drawer__foot">
          <button class="btn btn--ghost" id="clearWish" type="button">تفريغ المفضلة</button>
        </div>
      </div>
    </aside>

    <div class="modal" id="commentModal" aria-hidden="true">
      <div class="modal__overlay" data-close="comment"></div>
      <div class="modal__panel" role="dialog" aria-label="Comments" aria-modal="true">
        <div class="modal__head">
          <div>
            <div class="modal__title" id="commentTitle">تعليقات</div>
            <div class="modal__sub" id="commentSub">—</div>
          </div>
          <button class="iconBtn" type="button" data-close="comment" aria-label="Close">✕</button>
        </div>

        <div class="modal__body">
          <form class="commentForm" id="commentForm" autocomplete="off">
            <input class="input" id="commentName" maxlength="22" placeholder="اسمك" required/>
            <input class="input" id="commentText" maxlength="140" placeholder="اكتب تعليق..." required/>
            <button class="btn btn--primary" type="submit">إرسال</button>
          </form>
          <div class="comments" id="commentList"></div>
        </div>

        <div class="modal__foot">
          <button class="btn btn--ghost" id="clearComments" type="button">مسح تعليقات هذا المنتج</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
